<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncatewords: 50 }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="site-title">
        <img src="{{ '/assets/logo.png' | relative_url }}" alt="Hyrax">
        Hyrax <span>Insights</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Reports</a>
        <a href="{{ '/cv/' | relative_url }}">About the Author</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <!-- Newsletter subscription (disabled for now)
      <div class="subscribe-box">
        <h3>Subscribe to AEC Insights</h3>
        <p>주간 AEC 산업·학계 인사이트를 이메일로 받아보세요.</p>
        <form class="subscribe-form" action="https://buttondown.com/api/emails/embed-subscribe/hyrax-insights" method="post" target="_blank">
          <input type="email" name="email" placeholder="your@email.com" required>
          <button type="submit">Subscribe</button>
        </form>
      </div>
      -->
      <div class="footer-links">
        <a href="{{ '/' | relative_url }}">Reports</a>
        <a href="{{ '/cv/' | relative_url }}">About the Author</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS Feed</a>
        <a href="https://github.com/odd-Innocent" target="_blank">GitHub</a>
      </div>
      <p class="footer-copy">&copy; {{ 'now' | date: '%Y' }} Hyrax AEC Insights. Powered by Hyrax Deep Think Tank — AI-driven research intelligence.</p>
    </div>
  </footer>
</body>
</html>
