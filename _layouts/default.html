<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncatewords: 50 }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="site-title">
        <img src="{{ '/assets/logo.png' | relative_url }}" alt="Hyrax" style="height: 32px; vertical-align: middle; margin-right: 8px; border-radius: 4px;">Hyrax <span>Insights</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Reports</a>
        <a href="{{ '/cv/' | relative_url }}">CV</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="subscribe-box" style="margin-bottom: 24px;">
        <h3>📬 AEC Insights 구독</h3>
        <p>매주 최신 AEC 산업·학계 인사이트를 이메일로 받아보세요.</p>
        <form class="subscribe-form" action="https://buttondown.com/api/emails/embed-subscribe/hyrax-insights" method="post" target="_blank">
          <input type="email" name="email" placeholder="이메일 주소" required>
          <button type="submit">Subscribe</button>
        </form>
      </div>
      <p>Powered by <strong>Hyrax Deep Think Tank</strong> — AI-Driven AEC Research Intelligence</p>
      <p>&copy; {{ 'now' | date: '%Y' }} odd-Innocent. Generated autonomously.</p>
    </div>
  </footer>
</body>
</html>
