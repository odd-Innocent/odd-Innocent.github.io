title: "Hyrax AEC Insights"
description: "AI-Powered Research Intelligence for Architecture, Engineering & Construction"
url: "https://odd-innocent.github.io"
baseurl: ""
lang: ko
timezone: Asia/Seoul

# Build
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

# Collections
collections:
  reports:
    output: true
    permalink: /reports/:path/

# Default front matter
defaults:
  - scope:
      path: "_reports"
      type: "reports"
    values:
      layout: "report"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Feed
feed:
  path: feed.xml
  posts_limit: 20

# Exclude
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .github
